name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # TODO: add npm run contract:check once Fisayo's contract URL is known

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: deploy-web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hand the checked commit to Qocent
        run: git push --force origin HEAD:deploy/web